<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גדי פוליטי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#b5284f;
    --mint:#c9f1ee;
    --ink:#1a1a1a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#ffffff;
    color:var(--ink);
    font-family:'Open Sans', Arial, sans-serif;
    font-weight:500;
  }
  img{max-width:100%; height:auto; display:block;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:.8rem 1rem;
    padding:1.6rem clamp(1.2rem,4vw,3.5rem);
  }
  header .logo{flex-shrink:0;}
  header .logo img{height:67px; width:auto; max-width:none;}

  nav ul{
    display:flex;
    flex-wrap:wrap;
    gap:clamp(1.4rem,3vw,2.6rem);
    list-style:none;
    margin-top:25px;
  }
  nav a{
    color:var(--ink);
    text-decoration:none;
    font-size:1.05rem;
    white-space:nowrap;
  }
  nav a:hover{color:var(--accent);}

  @media (max-width:600px){
    header{
      flex-direction:column;
      gap:.8rem;
    }
    header .logo{
      order:1;
      margin-right:auto;
    }
    header nav{
      order:2;
      align-self:center;
    }
    nav ul{margin-top:0;}
  }

  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(2rem,6vw,4rem) 1.5rem clamp(4rem,10vw,7rem);
  }

  .slideshow-wrap{
    width:min(700px,90vw);
  }

  .caption-stack{
    position:relative;
    height:2.6em;
    margin-bottom:1rem;
    text-align:right;
  }
  .caption{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    font-size:clamp(1.5rem,3.4vw,2.2rem);
    opacity:0;
    pointer-events:none;
    transition:opacity .7s ease;
  }
  .caption.active{opacity:1; pointer-events:auto;}

  /* כפתור עצירת המצגת — נדרש לפי WCAG 2.2.2 */
  .slide-toggle{
    display:flex;
    align-items:center;
    gap:.5rem;
    width:fit-content;
    margin-top:1.1rem;
    min-height:44px;
    padding:.5rem 1.2rem;
    font:inherit;
    font-size:1rem;
    color:var(--ink);
    background:#fff;
    border:2px solid var(--ink);
    border-radius:999px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .slide-toggle:hover{background:var(--ink); color:#fff;}
  .caption a{
    color:var(--accent);
    text-decoration:none;
  }

  .slideshow{
    position:relative;
    width:100%;
    box-shadow:26px 26px 46px rgba(0,0,0,.3);
  }
  .slideshow img{
    display:block;
    width:100%;
    height:auto;
    opacity:1;
    transition:opacity .5s ease;
  }

  /* ===== התאמות נגישות (ת"י 5568 / WCAG 2.0 AA) ===== */
  .skip-link{
    position:absolute;
    right:-9999px;
    top:0;
    z-index:100;
    background:var(--accent);
    color:#fff;
    padding:.85rem 1.4rem;
    font-size:1rem;
    text-decoration:none;
    border-radius:0 0 8px 8px;
  }
  .skip-link:focus{right:1rem;}

  :focus-visible{
    outline:3px solid var(--accent);
    outline-offset:3px;
  }

  .visually-hidden{
    position:absolute !important;
    width:1px; height:1px;
    margin:-1px; padding:0;
    overflow:hidden;
    clip:rect(0 0 0 0);
    clip-path:inset(50%);
    white-space:nowrap;
    border:0;
  }
  .site-footer{
    text-align:center;
    padding:2rem 1.2rem clamp(2rem,5vw,3rem);
    border-top:1px solid #e5e5e5;
    margin-top:2rem;
  }
  .site-footer a{
    color:var(--ink);
    font-size:.95rem;
    text-decoration:none;
  }
  .site-footer a:hover{color:var(--accent);}
</style>
</head>
<body>

  <a class="skip-link" href="#main">דלג לתוכן הראשי</a>

  <header>
    <nav aria-label="ניווט ראשי">
      <ul>
        <li><a href="about.html">אודות</a></li>
        <li><a href="works.html">עבודות</a></li>
        <li><a href="contact.html">צור קשר</a></li>
      </ul>
    </nav>
    <div class="logo">
      <img src="Gadi_Politi_Logo.png" alt="גדי פוליטי — חזרה לדף הבית">
    </div>
  </header>

  <main id="main">

  <h1 class="visually-hidden">גדי פוליטי — עיצוב גרפי, פרסום, קופירייטינג, מיתוג ודיגיטל</h1>

  <section class="hero">
    <div class="slideshow-wrap" role="group" aria-roledescription="מצגת" aria-label="עבודות נבחרות">
      <div class="caption-stack">
        <span class="caption active"><a href="graphic-design.html">עיצוב גרפי</a></span>
        <span class="caption" aria-hidden="true"><a href="advertising.html" tabindex="-1">פרסום</a></span>
        <span class="caption" aria-hidden="true"><a href="copywriting.html" tabindex="-1">קופירייטינג</a></span>
        <span class="caption" aria-hidden="true"><a href="branding.html" tabindex="-1">מיתוג</a></span>
        <span class="caption" aria-hidden="true"><a href="digital.html" tabindex="-1">דיגיטל</a></span>
        <span class="caption" aria-hidden="true"><a href="municipalities.html" tabindex="-1">עיריות</a></span>
      </div>
      <div class="slideshow">
        <a id="slideLink" href="graphic-design.html"><img id="slideImg" src="Design_01.jpg" alt="קמפיין לעיריית הרצליה: משאית אשפה עטופה במדבקת ״כשהרחובות מצטחצחים העיר פורחת!״ ולצדה שני שלטים נוספים מהסדרה" width="1500" height="1150"></a>
      </div>
      <button type="button" id="slideToggle" class="slide-toggle" aria-pressed="false">
        <span class="slide-toggle-icon" aria-hidden="true">❚❚</span>
        <span id="slideToggleText">עצירת המצגת</span>
      </button>
    </div>
  </section>

  <script>
    const slides = [
      {img:'Design_01.jpg',   link:'graphic-design.html', alt:'קמפיין לעיריית הרצליה: משאית אשפה עטופה במדבקת ״כשהרחובות מצטחצחים העיר פורחת!״ ולצדה שני שלטים נוספים מהסדרה'},
      {img:'Adv_01.jpg',      link:'advertising.html',    alt:'מודעת אלקטרה: הר מושלג שראשו חשוף, ולצדו מקרר עם הכיתוב ״משיקים את המקרר בעל המקפיא התחתון של אלקטרה״'},
      {img:'Copy_01.jpg',     link:'copywriting.html',    alt:'מודעת ״יותר ממחשבון״: הכותרת הגדולה ״שו? מה?!״ מעל טקסט על עריכת שומה ומיסוי מקרקעין'},
      {img:'Branding_01.jpg', link:'branding.html',       alt:'דוגמת עיטוף למותג הסושי ISHIMAKI: חזרות של הלוגו, פרצוף מסוגנן ומקלות אכילה בשחור, ורוד וירוק'},
      {img:'Digital_01.jpg',  link:'digital.html',        alt:'סדרת באנרים לאירועי יין של יקב Jaffa, ובהם צילומי כוסות יין, חבית וקורקים'},
      {img:'Muni/01_Muni_Herzliya_Mosquito.jpg', link:'municipalities.html', alt:'שלט חוצות של עיריית הרצליה: איור יתוש מחייך עם הכיתוב ״מייבשים את היתושים״'}
    ];

    const INTERVAL = 3500;
    const slideImg    = document.getElementById('slideImg');
    const slideLink   = document.getElementById('slideLink');
    const captions    = document.querySelectorAll('.caption');
    const toggleBtn   = document.getElementById('slideToggle');
    const toggleText  = document.getElementById('slideToggleText');
    const toggleIcon  = toggleBtn.querySelector('.slide-toggle-icon');
    const wrap        = document.querySelector('.slideshow-wrap');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let current = 0;
    let timer = null;
    let paused = false;

    // רק הכיתובית הפעילה נגישה למקלדת ולקוראי מסך.
    // הסתמכות על visibility ב-CSS אינה אמינה כאן: המעבר בן 0.7 שניות
    // משאיר את הכיתובית היוצאת נגישה ל-Tab לאורך המעבר.
    function syncCaptions(){
      captions.forEach(function(cap){
        const link = cap.querySelector('a');
        if(cap.classList.contains('active')){
          cap.removeAttribute('aria-hidden');
          link.removeAttribute('tabindex');
        } else {
          cap.setAttribute('aria-hidden','true');
          link.setAttribute('tabindex','-1');
        }
      });
    }

    function showSlide(index){
      const nextIndex = (index + slides.length) % slides.length;
      slideImg.style.opacity = 0;
      setTimeout(function(){
        captions[current].classList.remove('active');
        current = nextIndex;
        const slide = slides[current];
        slideImg.src = slide.img;
        slideImg.alt = slide.alt;      // הטקסט החלופי מתעדכן יחד עם התמונה
        slideLink.href = slide.link;
        captions[current].classList.add('active');
        syncCaptions();
        slideImg.style.opacity = 1;
      }, 500);
    }

    function runTimer(){ if(!timer) timer = setInterval(function(){ showSlide(current + 1); }, INTERVAL); }
    function haltTimer(){ if(timer){ clearInterval(timer); timer = null; } }

    function play(){
      paused = false;
      runTimer();
      toggleBtn.setAttribute('aria-pressed','false');
      toggleText.textContent = 'עצירת המצגת';
      toggleIcon.textContent = '❚❚';
    }

    function pause(){
      paused = true;
      haltTimer();
      toggleBtn.setAttribute('aria-pressed','true');
      toggleText.textContent = 'הפעלת המצגת';
      toggleIcon.textContent = '▶';
    }

    toggleBtn.addEventListener('click', function(){ paused ? play() : pause(); });

    // עצירה זמנית כל עוד העכבר מעל המצגת או שהמיקוד נמצא בתוכה
    wrap.addEventListener('mouseenter', function(){ if(!paused) haltTimer(); });
    wrap.addEventListener('mouseleave', function(){ if(!paused) runTimer(); });
    wrap.addEventListener('focusin',    function(){ if(!paused) haltTimer(); });
    wrap.addEventListener('focusout',   function(){ if(!paused) runTimer(); });

    // מי שביקש תנועה מופחתת במערכת ההפעלה מקבל מצגת עצורה מלכתחילה
    syncCaptions();
    if(reduceMotion){ pause(); } else { play(); }
  </script>
  </main>

  <footer class="site-footer">
    <a href="accessibility.html">הצהרת נגישות</a>
  </footer>

</body>
</html>
