<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גדי פוליטי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#b5284f;
    --mint:#c9f1ee;
    --ink:#1a1a1a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#ffffff;
    color:var(--ink);
    font-family:'Open Sans', Arial, sans-serif;
    font-weight:500;
  }
  img{max-width:100%; display:block;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:.8rem 1rem;
    padding:1.6rem clamp(1.2rem,4vw,3.5rem);
  }
  header .logo{flex-shrink:0;}
  header .logo img{height:67px; width:auto; max-width:none;}

  nav ul{
    display:flex;
    flex-wrap:wrap;
    gap:clamp(1.4rem,3vw,2.6rem);
    list-style:none;
    margin-top:25px;
  }
  nav a{
    color:var(--ink);
    text-decoration:none;
    font-size:1.05rem;
    white-space:nowrap;
  }
  nav a:hover{color:var(--accent);}

  @media (max-width:600px){
    header{
      flex-direction:column;
      gap:.8rem;
    }
    header .logo{
      order:1;
      margin-right:auto;
    }
    header nav{
      order:2;
      align-self:center;
    }
    nav ul{margin-top:0;}
  }

  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(2rem,6vw,4rem) 1.5rem clamp(4rem,10vw,7rem);
  }

  .slideshow-wrap{
    width:min(700px,90vw);
  }

  .caption-stack{
    position:relative;
    height:2.6em;
    margin-bottom:1rem;
    text-align:right;
  }
  .caption{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    font-size:clamp(1.5rem,3.4vw,2.2rem);
    opacity:0;
    pointer-events:none;
    transition:opacity .7s ease;
  }
  .caption.active{opacity:1; pointer-events:auto;}
  .caption a{
    color:var(--accent);
    text-decoration:none;
  }

  .slideshow{
    position:relative;
    width:100%;
    box-shadow:26px 26px 46px rgba(0,0,0,.3);
  }
  .slideshow img{
    display:block;
    width:100%;
    height:auto;
    opacity:1;
    transition:opacity .5s ease;
  }
</style>
</head>
<body>

  <header>
    <nav>
      <ul>
        <li><a href="about.html">אודות</a></li>
        <li><a href="works.html">עבודות</a></li>
        <li><a href="contact.html">צור קשר</a></li>
      </ul>
    </nav>
    <div class="logo">
      <img src="Gadi_Politi_Logo.png" alt="גדי פוליטי">
    </div>
  </header>

  <section class="hero">
    <div class="slideshow-wrap">
      <div class="caption-stack">
        <span class="caption active"><a href="graphic-design.html">עיצוב גרפי</a></span>
        <span class="caption"><a href="advertising.html">פרסום</a></span>
        <span class="caption"><a href="copywriting.html">קופירייטינג</a></span>
        <span class="caption"><a href="branding.html">מיתוג</a></span>
        <span class="caption"><a href="digital.html">דיגיטל</a></span>
      </div>
      <div class="slideshow">
        <a id="slideLink" href="graphic-design.html"><img id="slideImg" src="Design_01.jpg" alt="עיצוב גרפי"></a>
      </div>
    </div>
  </section>

  <script>
    const images = [
      'Design_01.jpg',
      'Adv_01.jpg',
      'Copy_01.jpg',
      'Branding_01.jpg',
      'Digital_01.png'
    ];
    const links = [
      'graphic-design.html',
      'advertising.html',
      'copywriting.html',
      'branding.html',
      'digital.html'
    ];
    const slideImg = document.getElementById('slideImg');
    const slideLink = document.getElementById('slideLink');
    const captions = document.querySelectorAll('.caption');
    let current = 0;
    setInterval(() => {
      slideImg.style.opacity = 0;
      setTimeout(() => {
        captions[current].classList.remove('active');
        current = (current + 1) % images.length;
        slideImg.src = images[current];
        slideLink.href = links[current];
        captions[current].classList.add('active');
        slideImg.style.opacity = 1;
      }, 500);
    }, 3500);
  </script>

</body>
</html>
