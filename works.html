<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עבודות | גדי פוליטי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#b5284f;
    --mint:#c9f1ee;
    --ink:#1a1a1a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#ffffff;
    color:var(--ink);
    font-family:'Open Sans', Arial, sans-serif;
    font-weight:500;
  }
  img{max-width:100%; display:block;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:.8rem 1rem;
    padding:1.6rem clamp(1.2rem,4vw,3.5rem);
  }
  header .logo{flex-shrink:0;}
  header .logo img{height:67px; width:auto; max-width:none;}

  nav ul{
    display:flex;
    flex-wrap:wrap;
    gap:clamp(1.4rem,3vw,2.6rem);
    list-style:none;
    margin-top:25px;
  }
  nav a{
    color:var(--ink);
    text-decoration:none;
    font-size:1.05rem;
    white-space:nowrap;
  }
  nav a:hover{color:var(--accent);}

  @media (max-width:600px){
    header{
      flex-direction:column;
      gap:.8rem;
    }
    header .logo{
      order:1;
      margin-right:auto;
    }
    header nav{
      order:2;
      align-self:center;
    }
    nav ul{margin-top:0;}
  }

  .works{
    padding:clamp(2rem,6vw,3rem) clamp(1.2rem,4vw,3.5rem) clamp(4rem,10vw,6rem);
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:2rem 1.4rem;
  }
  @media (min-width:700px){
    .works{
      grid-template-columns:repeat(3,1fr);
    }
  }
  .work-item{
    display:block;
    color:inherit;
    text-decoration:none;
  }
  .work-item h2{
    font-size:clamp(1.5rem,3vw,1.95rem);
    color:var(--accent);
    font-weight:500;
    text-align:right;
    margin-bottom:.6rem;
  }
  .work-item .frame{
    box-shadow:14px 14px 26px rgba(0,0,0,.3);
  }
</style>
</head>
<body>

  <header>
    <nav>
      <ul>
        <li><a href="about.html">אודות</a></li>
        <li><a href="works.html">עבודות</a></li>
        <li><a href="contact.html">צור קשר</a></li>
      </ul>
    </nav>
    <div class="logo">
      <a href="index.html"><img src="Gadi_Politi_Logo.png" alt="גדי פוליטי"></a>
    </div>
  </header>

  <section class="works">
    <a class="work-item" href="advertising.html">
      <h2>פרסום</h2>
      <div class="frame"><img src="Adv_01.jpg" alt="פרסום"></div>
    </a>
    <a class="work-item" href="copywriting.html">
      <h2>קופירייטינג</h2>
      <div class="frame"><img src="Copy_01.jpg" alt="קופירייטינג"></div>
    </a>
    <a class="work-item" href="branding.html">
      <h2>מיתוג</h2>
      <div class="frame"><img src="Branding_01.jpg" alt="מיתוג"></div>
    </a>
    <a class="work-item" href="digital.html">
      <h2>דיגיטל</h2>
      <div class="frame"><img src="Digital_01.png" alt="דיגיטל"></div>
    </a>
    <a class="work-item" href="graphic-design.html">
      <h2>עיצוב גרפי</h2>
      <div class="frame"><img src="Design_01.jpg" alt="עיצוב גרפי"></div>
    </a>
  </section>

</body>
</html>
